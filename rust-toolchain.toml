[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# The runtime of WebAssembly programs, for WASI (with WASI's C library they
# link with) and for web pages, and of Android apps.
targets = [
    "wasm32-wasip1",
    "wasm32-unknown-unknown",
    "x86_64-linux-android",
    "aarch64-linux-android",
]
